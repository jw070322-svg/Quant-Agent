[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.1.0"
description = "Reproducible quant research and paper-trading pipeline (handover rebuild, Phase 0-2)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tushare = ["tushare>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
